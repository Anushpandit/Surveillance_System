<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · AI Surveillance</title><link rel="stylesheet" href="/assets/css/style.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="brand"><span class="brand-mark">◉</span> AI Surveillance</div><h1>Create account</h1><p>New accounts are created with viewer access.</p><form id="registerForm" class="form"><label>Username<input name="username" minlength="3" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><div id="formError" class="form-error" role="alert"></div><button class="btn btn-primary" type="submit">Create account</button></form><div class="auth-links">Already registered? <a href="/login">Sign in</a></div></section></main><script>document.getElementById('registerForm').addEventListener('submit',async(event)=>{event.preventDefault();const form=new FormData(event.target),error=document.getElementById('formError');error.textContent='';try{const response=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))}),data=await response.json();if(!response.ok)throw new Error(data.detail||'Could not create account');window.location.href='/login'}catch(err){error.textContent=err.message}});</script></body></html>
