<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · AI Surveillance</title><link rel="stylesheet" href="/assets/css/style.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="brand"><span class="brand-mark">◉</span> AI Surveillance</div><h1>Welcome back</h1><p>Sign in to monitor incidents and review event history.</p><form id="loginForm" class="form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><div id="formError" class="form-error" role="alert"></div><button class="btn btn-primary" type="submit">Sign in</button></form><div class="auth-links">Need an account? <a href="/register">Create one</a></div></section></main><script src="/assets/js/auth.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async(event)=>{event.preventDefault();const form=new FormData(event.target),error=document.getElementById('formError');error.textContent='';try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(form)}),data=await response.json();if(!response.ok)throw new Error(data.detail||'Could not sign in');Auth.setToken(data.access_token);window.location.href='/dashboard'}catch(err){error.textContent=err.message}});</script></body></html>
